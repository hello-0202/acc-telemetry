<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>悬浮窗主题预览</title>
<style>
  :root{--text:#E9EEF4;--faint:#5B6572}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 24px 44px;color:var(--text);
       background:radial-gradient(1200px 600px at 50% -10%,#101722,#05070A);
       font-family:'Chakra Petch','Bahnschrift','Microsoft YaHei',system-ui,sans-serif}
  h1{font-size:18px;letter-spacing:.08em;margin:0 0 4px}
  .sub{color:var(--faint);font-size:12px;margin-bottom:24px}
  .grid{display:flex;flex-wrap:wrap;gap:30px 34px;align-items:flex-start}
  .item{display:flex;flex-direction:column;gap:7px}
  .cap{font-size:13px}
  .meta{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--faint)}
  .stage{position:relative;border-radius:12px;overflow:hidden;
         background:
           radial-gradient(120% 120% at 30% 0%,rgba(120,140,170,.12),transparent 60%),
           linear-gradient(rgba(150,162,177,.055) 1px,transparent 1px) 0 0/26px 26px,
           linear-gradient(90deg,rgba(150,162,177,.055) 1px,transparent 1px) 0 0/26px 26px,
           #10151C;
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 18px 40px rgba(0,0,0,.5)}
  .stage iframe{border:0;display:block;background:transparent;margin:20px}
</style>
</head>
<body>
  <h1>悬浮窗主题预览</h1>
  <div class="sub">演示数据（非真实遥测）· 按设计尺寸 1:1 展示 · 背景是模拟的游戏画面（主题本身完全透明）</div>
  <div class="grid" id="grid"></div>
  <script>
  var THEMES = [{"label": "① 踏板 + 方向盘 <span style=\"color:#5B6572\">（左右竖直踏板条向上填充 · 方向盘随转向转 + 外圈左右转向弧）<\/span>", "id": "pedals-wheel", "w": 300, "h": 190, "html": "<!doctype html>\n<html lang=\"zh-CN\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>踏板 + 方向盘<\/title>\n    <style>\n/* 踏板 + 方向盘 —— 设计基准 300×190，全部 px 写死，缩放交给宿主（contain）。\n *\n * 视觉取向：左右两根【竖直矩形踏板条】（从底部往上填充、数值上下变）+ 中间方向盘，\n * 背景完全透明，没有底板 / 没有卡片边框。\n */\n\nhtml,\nbody {\n  height: 100%;\n  margin: 0;\n  padding: 0;\n  background: transparent;\n  overflow: hidden;\n}\n\nbody {\n  /* 与软件外壳同一套字体栈（src/style.css 的 --font-display），数字单独用 --font-mono */\n  font-family: 'Chakra Petch', 'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', sans-serif;\n  color: #ffffff;\n  -webkit-user-select: none;\n  user-select: none;\n  cursor: default;\n}\n\n.hud {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 14px;\n}\n\n/* ---------------- 左右踏板：竖直矩形条 ---------------- */\n.pedal {\n  position: relative;\n  flex: none;\n  width: 44px;\n  height: 190px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 7px;\n}\n\n.p-lab {\n  font-size: 9px;\n  font-weight: 700;\n  letter-spacing: 0.16em;\n  color: #9aa5b1;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n.brake .p-lab {\n  color: #ff3d52;\n}\n\n.thr .p-lab {\n  color: #00f067;\n}\n\n/* 条本体 = 一个凹槽：底色 + 刻度 + 内描边都在填充之上，填充只负责在里面涨高。 */\n.p-bar {\n  position: relative;\n  width: 28px;\n  height: 104px;\n  /* 槽底压深一点，填充与槽的对比才够（透明背景上尤其重要） */\n  background: rgba(10, 14, 19, 0.72);\n  border-radius: 0;\n  overflow: hidden;\n}\n\n/* 刻度线：画在填充之上，填充涨到哪刻度都还看得见（\"装在槽里\"的观感） */\n.p-bar::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  background: repeating-linear-gradient(\n    to top,\n    transparent 0,\n    transparent 24.6%,\n    rgba(255, 255, 255, 0.2) 24.6%,\n    rgba(255, 255, 255, 0.2) 25%\n  );\n}\n\n/* 内描边：最上层，压住填充边缘，保证框线始终是完整的一圈 */\n.p-bar::after {\n  content: '';\n  position: absolute;\n  inset: 0;\n  z-index: 3;\n  pointer-events: none;\n  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);\n}\n\n/* 填充：从底部往上长，高度 = 踏板开度。z-index 压在刻度/描边之下，所以不会盖住槽壁。\n * 不做 height 过渡：刷新间隔 60ms，过渡会被下一帧反复打断，填充高度会明显落后于数值\n * （实测显示 98% 但只填了不到一半）。60ms 直更已经够顺滑。 */\n.p-fill {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  z-index: 1;\n  height: 0%;\n}\n\n/* 纯色填充：不做渐变、不做发光，边界就是一条硬线。\n * 高饱和 + 高亮度：背景会透明在游戏画面上，颜色发暗会在亮场景里糊掉。 */\n.brake .p-fill {\n  background: #ff1f38;\n}\n\n.thr .p-fill {\n  background: #00dd5c;\n}\n\n.p-val {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 15px;\n  font-weight: 700;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  color: #ffffff;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n/* ---------------- 中间：方向盘 ---------------- */\n.steer {\n  position: relative;\n  flex: none;\n  width: 140px;\n  height: 190px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n}\n\n.wheel {\n  display: block;\n  width: 140px;\n  height: 140px;\n  overflow: visible;\n}\n\n/* 静态刻度环（270°，底部留缺口） */\n.st-track {\n  fill: none;\n  stroke: rgba(255, 255, 255, 0.18);\n  stroke-width: 3;\n  stroke-dasharray: 75 100;\n}\n\n/* 左 / 右转向弧（-450..450 度映射到 ±135°，即 37.5 个 dasharray 单位）\n * 不做 dasharray 过渡：60ms 刷新会打断 80ms 过渡，弧长永远追不上真实值。 */\n/* 弧端与连接一律平切（butt / miter），不要圆头也不要发光 */\n.st-left,\n.st-right {\n  fill: none;\n  stroke-width: 6;\n  stroke-linecap: butt;\n  stroke-linejoin: miter;\n  stroke-dasharray: 0 100;\n  opacity: 0;\n}\n\n.st-left {\n  stroke: #1a94ff;\n}\n\n.st-right {\n  stroke: #ff9500;\n}\n\n.w-rim {\n  fill: none;\n  stroke: rgba(255, 255, 255, 0.5);\n  stroke-width: 8;\n}\n\n#wheel-spin line {\n  stroke: rgba(255, 255, 255, 0.75);\n  stroke-width: 7;\n  stroke-linecap: butt;\n  stroke-linejoin: miter;\n}\n\n.w-hub {\n  fill: #141c26;\n  stroke: rgba(255, 255, 255, 0.85);\n  stroke-width: 3;\n}\n\n/* 12 点标记：随盘转动，转起来才看得出角度 */\n.w-top {\n  fill: #00e676;\n}\n\n.st-read {\n  display: flex;\n  align-items: baseline;\n  margin-top: -8px;\n}\n\n.st-read b {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 20px;\n  font-weight: 700;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  color: #ffffff;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n/* 未开始 / 等待：整体压暗，别把上次的值当实时值 */\n.hud[data-status=\"idle\"],\n.hud[data-status=\"waiting\"],\n.hud[data-status=\"error\"] {\n  opacity: 0.5;\n}\n\n<\/style>\n  <\/head>\n  <body>\n    <!-- 设计基准 300×190（见 theme.json）。宿主按 contain 等比缩放，直接按像素写。\n         视觉：左右两根竖直矩形踏板条（从底部往上填充）+ 中间方向盘，背景透明无底板，\n         纯色填充、直角边界、无发光。 -->\n    <div class=\"hud\" id=\"hud\" data-status=\"idle\">\n      <!-- 左：刹车 -->\n      <div class=\"pedal brake\">\n        <span class=\"p-lab\">BRAKE<\/span>\n        <div class=\"p-bar\">\n          <div class=\"p-fill\" id=\"brake-fill\"><\/div>\n        <\/div>\n        <span class=\"p-val\" id=\"brake-val\">--<\/span>\n      <\/div>\n\n      <!-- 中：方向盘 + 外圈左右转向弧 -->\n      <div class=\"steer\">\n        <svg class=\"wheel\" viewBox=\"0 0 168 168\" aria-hidden=\"true\">\n          <!-- 静态刻度环（270°，缺口朝下） -->\n          <circle class=\"st-track\" cx=\"84\" cy=\"84\" r=\"72\" pathLength=\"100\" transform=\"rotate(135 84 84)\" />\n          <!-- 右转弧：从正上方顺时针生长；左转弧：从正上方逆时针生长（rotate 由 JS 跟随弧长更新） -->\n          <circle class=\"st-right\" id=\"st-right\" cx=\"84\" cy=\"84\" r=\"72\" pathLength=\"100\" transform=\"rotate(-90 84 84)\" />\n          <circle class=\"st-left\" id=\"st-left\" cx=\"84\" cy=\"84\" r=\"72\" pathLength=\"100\" transform=\"rotate(-90 84 84)\" />\n          <!-- 方向盘本体：整体随转向角旋转 -->\n          <g id=\"wheel-spin\">\n            <circle class=\"w-rim\" cx=\"84\" cy=\"84\" r=\"52\" />\n            <line x1=\"84\" y1=\"84\" x2=\"84\" y2=\"34\" />\n            <line x1=\"84\" y1=\"84\" x2=\"41\" y2=\"109\" />\n            <line x1=\"84\" y1=\"84\" x2=\"127\" y2=\"109\" />\n            <circle class=\"w-hub\" cx=\"84\" cy=\"84\" r=\"10\" />\n            <polygon class=\"w-top\" points=\"84,20 76,32 92,32\" />\n          <\/g>\n        <\/svg>\n        <div class=\"st-read\">\n          <b id=\"steer-deg\">0°<\/b>\n        <\/div>\n      <\/div>\n\n      <!-- 右：油门 -->\n      <div class=\"pedal thr\">\n        <span class=\"p-lab\">THROTTLE<\/span>\n        <div class=\"p-bar\">\n          <div class=\"p-fill\" id=\"thr-fill\"><\/div>\n        <\/div>\n        <span class=\"p-val\" id=\"thr-val\">--<\/span>\n      <\/div>\n    <\/div>\n\n    <script>\n/* 踏板 + 方向盘 —— 主题侧脚本。\n *\n * 宿主 → 主题：{ type:'acc:init' } / { type:'acc:state', payload }\n * 主题 → 宿主：{ type:'acc:ready' }\n * 独立打开（双击 index.html）没有宿主，2 秒后自动跑演示数据。\n *\n * 踏板条：填充高度 = 开度百分比（从底部往上长）。\n * 方向盘外圈：pathLength=\"100\" 归一化，270° 整圈 = 75 单位，\n *   ±450° 映射到 ±135°，即 37.5 个 dasharray 单位。\n */\n(function () {\n  'use strict';\n\n  var $ = function (id) { return document.getElementById(id); };\n  // isFinite(null) === true 是个坑：真机 null 字段必须先挡掉\n  function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }\n  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }\n\n  var hud = $('hud');\n  var spin = $('wheel-spin');\n  var stLeft = $('st-left');\n  var stRight = $('st-right');\n  var brakeFill = $('brake-fill');\n  var thrFill = $('thr-fill');\n\n  var gotState = false;\n  var demoTimer = null;\n  var demoTick = null;\n\n  function sayReady() {\n    try { window.parent.postMessage({ type: 'acc:ready' }, '*'); } catch (e) { /* ignore */ }\n  }\n\n  /* 踏板条填充高度：p 0..1 */\n  function setFill(el, p) {\n    el.style.height = (p * 100).toFixed(1) + '%';\n  }\n\n  /* 转向弧：len 是 dasharray 单位，0..37.5（37.5 = 135°） */\n  function setSteerArcs(s) {\n    var len = Math.abs(s) * 37.5;\n    if (s > 0.004) {\n      // 右：从正上方顺时针长\n      stRight.setAttribute('transform', 'rotate(-90 84 84)');\n      stRight.style.strokeDasharray = len.toFixed(2) + ' 100';\n      stRight.style.opacity = '1';\n      stLeft.style.opacity = '0';\n    } else if (s < -0.004) {\n      // 左：起点沿弧往回退 len，顺时针画 len 正好收在正上方\n      stLeft.setAttribute('transform', 'rotate(' + (-90 - len * 3.6).toFixed(2) + ' 84 84)');\n      stLeft.style.strokeDasharray = len.toFixed(2) + ' 100';\n      stLeft.style.opacity = '1';\n      stRight.style.opacity = '0';\n    } else {\n      stLeft.style.opacity = '0';\n      stRight.style.opacity = '0';\n    }\n  }\n\n  function render(st) {\n    try {\n      hud.dataset.status = st.status || 'idle';\n      var car = st.car || {};\n\n      var thr = num(car.throttle);\n      var brk = num(car.brake);\n      var steer = num(car.steer);\n\n      var thrP = thr == null ? 0 : clamp01(thr);\n      var brkP = brk == null ? 0 : clamp01(brk);\n\n      setFill(thrFill, thrP);\n      setFill(brakeFill, brkP);\n      $('thr-val').textContent = thr == null ? '--' : Math.round(thrP * 100) + '%';\n      $('brake-val').textContent = brk == null ? '--' : Math.round(brkP * 100) + '%';\n\n      var degEl = $('steer-deg');\n\n      if (steer == null) {\n        spin.setAttribute('transform', 'rotate(0 84 84)');\n        setSteerArcs(0);\n        degEl.textContent = '--°';\n        return;\n      }\n\n      // 约定：steer -1..1，乘 450 得度数（本项目约定满舵 ±450°）\n      var s = steer < -1 ? -1 : steer > 1 ? 1 : steer;\n      var deg = s * 450;\n\n      spin.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ' 84 84)');\n      setSteerArcs(s);\n      // 只显角度，不显方向文字（方向直接看盘面和弧的颜色）\n      degEl.textContent = Math.round(Math.abs(deg)) + '°';\n    } catch (e) {\n      console.warn('[pedals-wheel] render failed', e);\n    }\n  }\n\n  window.addEventListener('message', function (ev) {\n    var m = ev.data;\n    if (!m || typeof m !== 'object') return;\n    if (m.type === 'acc:init') { sayReady(); return; }\n    if (m.type === 'acc:state' && m.payload) {\n      gotState = true;\n      stopDemo();\n      render(m.payload);\n    }\n  });\n\n  var framed = false;\n  try { framed = !!(window.parent && window.parent !== window); } catch (e) { framed = false; }\n\n  if (framed) {\n    sayReady();\n    demoTimer = setTimeout(function () { if (!gotState) startDemo(); }, 2000);\n  } else {\n    startDemo();\n  }\n\n  /* ------------------------------ 演示数据 ------------------------------ */\n  function startDemo() {\n    stopDemo();\n    var t = 0;\n    demoTick = setInterval(function () {\n      if (gotState) { stopDemo(); return; }\n      t += 1;\n      var w = Math.sin(t / 10);\n      render({\n        status: 'streaming',\n        car: {\n          throttle: clamp01(0.55 + w * 0.45),\n          brake: Math.max(0, 0.5 - w * 0.5),\n          steer: Math.sin(t / 23) * 0.7,\n        },\n      });\n    }, 60);\n  }\n\n  function stopDemo() {\n    if (demoTick !== null) { clearInterval(demoTick); demoTick = null; }\n    if (demoTimer !== null) { clearTimeout(demoTimer); demoTimer = null; }\n  }\n\n  setFill(brakeFill, 0);\n  setFill(thrFill, 0);\n})();\n\n<\/script>\n  <\/body>\n<\/html>\n"}, {"label": "② 油量策略 <span style=\"color:#5B6572\">（左标签右数值：剩余油量 / 可跑圈数 / 每圈油耗 / 建议加油量）<\/span>", "id": "throttle-fuel", "w": 260, "h": 140, "html": "<!doctype html>\n<html lang=\"zh-CN\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>油量策略<\/title>\n    <style>\n/* 油量策略 —— 设计基准 260×140，全部 px 写死，缩放交给宿主（contain）。\n *\n * 视觉取向：左侧标签名 + 右侧数值的两列数据表。\n * 纯色、直角、无发光、无边框、背景完全透明，直接浮在游戏画面上。\n */\n\nhtml,\nbody {\n  height: 100%;\n  margin: 0;\n  padding: 0;\n  background: transparent;\n  overflow: hidden;\n}\n\nbody {\n  /* 与软件外壳同一套字体栈（src/style.css 的 --font-display），数字单独用 --font-mono */\n  font-family: 'Chakra Petch', 'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', sans-serif;\n  color: #e9eef5;\n  -webkit-user-select: none;\n  user-select: none;\n  cursor: default;\n}\n\n.hud {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  box-sizing: border-box;\n  /* 左右留边：标签贴左、数值贴右，不顶到窗口边缘 */\n  padding: 0 18px;\n  display: flex;\n  align-items: center;\n}\n\n/* 三列：标签（吃掉剩余空间，靠左） / 数值（右对齐） / 单位（独立一列，右对齐）。\n * 数值列宽 = 该列最宽内容，配 text-align:right 后所有数字右边缘严格成一条线。 */\n.rows {\n  display: grid;\n  grid-template-columns: 1fr auto auto;\n  width: 100%;\n  align-items: baseline;\n  row-gap: 9px;\n}\n\n.k {\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  line-height: 1;\n  color: rgba(255, 255, 255, 0.82);\n  white-space: nowrap;\n  /* 1px 硬投影：透明背景下亮画面上能读，不是光晕 */\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n/* 分隔一下「建议加注量」：它是结论，不是原始读数 */\n.k.add {\n  color: #ffffff;\n}\n\n.v {\n  text-align: right;\n  white-space: nowrap;\n  padding-right: 6px;\n}\n\n.v b {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 19px;\n  font-weight: 700;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  color: #ffffff;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n.u {\n  min-width: 26px;\n  font-size: 10px;\n  line-height: 1;\n  letter-spacing: 0.06em;\n  /* 单位也右对齐：数字 + 单位的整体右边缘才是一条直线 */\n  text-align: right;\n  color: rgba(255, 255, 255, 0.72);\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n/* 可跑圈数告警：<2 圈红、<5 圈琥珀，其余正常 */\n#laps-row[data-level='low'] b {\n  color: #ff2136;\n}\n\n#laps-row[data-level='warn'] b {\n  color: #ffab00;\n}\n\n/* 建议加油量：需要加 = 绿；油够 = 灰 */\n#add-row[data-level='need'] b {\n  color: #00dd5c;\n}\n\n#add-row[data-level='ok'] b {\n  color: rgba(255, 255, 255, 0.62);\n}\n\n/* 未开始 / 等待：整体压暗，别把上次的值当实时值 */\n.hud[data-status='idle'],\n.hud[data-status='waiting'],\n.hud[data-status='error'] {\n  opacity: 0.5;\n}\n\n<\/style>\n  <\/head>\n  <body>\n    <!-- 设计基准 260×140（见 theme.json）。宿主按 contain 等比缩放，直接按像素写。\n         三列：标签名贴左 / 数值贴右 / 单位单独一列（两者右边缘对齐成一条线）。\n         纯色、直角、无发光、背景全透明。 -->\n    <div class=\"hud\" id=\"hud\" data-status=\"idle\">\n      <div class=\"rows\">\n        <span class=\"k\">FUEL<\/span>\n        <span class=\"v\"><b id=\"fuel-val\">--<\/b><\/span>\n        <span class=\"u\">L<\/span>\n\n        <span class=\"k\">LAPS LEFT<\/span>\n        <span class=\"v\" id=\"laps-row\"><b id=\"laps-val\">--<\/b><\/span>\n        <span class=\"u\">laps<\/span>\n\n        <span class=\"k\">PER LAP<\/span>\n        <span class=\"v\"><b id=\"per-val\">--<\/b><\/span>\n        <span class=\"u\">L<\/span>\n\n        <span class=\"k add\">SUGGESTED ADD<\/span>\n        <span class=\"v\" id=\"add-row\"><b id=\"add-val\">--<\/b><\/span>\n        <span class=\"u\">L<\/span>\n      <\/div>\n    <\/div>\n\n    <script>\n/* 油量策略 —— 主题侧脚本。\n *\n * 宿主 → 主题：{ type:'acc:init' } / { type:'acc:state', payload }\n * 主题 → 宿主：{ type:'acc:ready' }\n * 独立打开（双击 index.html）没有宿主，2 秒后自动跑演示数据。\n *\n * 四行都是「标签贴左 / 数值贴右」：\n *   FUEL           剩余油量            car.fuel\n *   LAPS LEFT      还能跑多少圈        car.fuelLapsLeft（缺失则 fuel / fuelPerLap）\n *   PER LAP        平均每圈油耗        car.fuelPerLap\n *   SUGGESTED ADD  建议加注量（算出来） 见 suggestAdd()\n *\n * 建议加油量的口径（纯前端算，不依赖后端新增字段）：\n *   需要跑完的圈数 × 每圈油耗 × (1 + 安全余量) − 当前油量\n *   圈数来源二选一：\n *     · 计时赛：session.timeLeftMs / 平均圈时   ← 这就是「当局还剩多少时间」\n *     · 圈数赛：session.lapsTotal − lap.completed\n *   平均圈时优先用上一圈 lap.lastMs（和游戏 fuelPerLap 的口径最接近），\n *   没有就退到 lap.bestMs，再退到 lap.estimatedMs。\n *   两者都拿不到（练习/无圈速）→ 显示 `--`，不瞎猜。\n */\n(function () {\n  'use strict';\n\n  var $ = function (id) { return document.getElementById(id); };\n  // isFinite(null) === true 是个坑：真机 null 字段必须先挡掉\n  function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }\n  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }\n\n  // 安全余量：多备 3%，抵轮胎退化 / 进站那圈的额外消耗\n  var FUEL_MARGIN = 1.03;\n\n  var hud = $('hud');\n  var fuelEl = $('fuel-val');\n  var lapsRow = $('laps-row');\n  var lapsEl = $('laps-val');\n  var perEl = $('per-val');\n  var addRow = $('add-row');\n  var addEl = $('add-val');\n\n  var gotState = false;\n  var demoTimer = null;\n  var demoTick = null;\n\n  function sayReady() {\n    try { window.parent.postMessage({ type: 'acc:ready' }, '*'); } catch (e) { /* ignore */ }\n  }\n\n  /* 平均圈时（ms）：上一圈 > 本场最佳 > 游戏估算 */\n  function avgLapMs(lap) {\n    var l = num(lap.lastMs);\n    if (l != null && l > 0) return l;\n    var b = num(lap.bestMs);\n    if (b != null && b > 0) return b;\n    var e = num(lap.estimatedMs);\n    if (e != null && e > 0) return e;\n    return null;\n  }\n\n  /* 还没跑完的圈数：计时赛按剩余时间折算，圈数赛按总圈数差 */\n  function lapsToGo(st) {\n    var s = st.session || {};\n    var lap = st.lap || {};\n\n    var tLeft = num(s.timeLeftMs);\n    if (tLeft != null && tLeft > 0) {\n      var avg = avgLapMs(lap);\n      if (avg == null) return null; // 有剩余时间但还没跑出过圈速\n      return tLeft / avg;\n    }\n\n    var total = num(s.lapsTotal);\n    if (total != null && total > 0) {\n      var done = num(lap.completed);\n      var left = total - (done == null ? 0 : done);\n      return left > 0 ? left : 0;\n    }\n\n    return null; // 练习/自由跑：没有终点，也就没有「该加多少」\n  }\n\n  /* 建议加油量（L）：>0 表示还要补这么多；<=0 表示油够 */\n  function suggestAdd(st, fuel, per) {\n    if (fuel == null || per == null || per <= 0) return null;\n    var toGo = lapsToGo(st);\n    if (toGo == null) return null;\n    return toGo * per * FUEL_MARGIN - fuel;\n  }\n\n  function render(st) {\n    try {\n      hud.dataset.status = st.status || 'idle';\n      var car = st.car || {};\n\n      /* ---------- FUEL ---------- */\n      var fuel = num(car.fuel);\n      fuelEl.textContent = fuel == null ? '--' : fuel.toFixed(1);\n\n      /* ---------- LAPS LEFT ---------- */\n      var per = num(car.fuelPerLap);\n      var laps = num(car.fuelLapsLeft);\n      // 主字段缺失时用 油量 / 每圈油耗 兜底\n      if (laps == null && fuel != null && per != null && per > 0) laps = fuel / per;\n\n      if (laps == null) {\n        lapsEl.textContent = '--';\n        lapsRow.dataset.level = '';\n      } else {\n        var lp = laps < 0 ? 0 : laps;\n        lapsEl.textContent = lp >= 100 ? String(Math.round(lp)) : lp.toFixed(1);\n        lapsRow.dataset.level = lp < 2 ? 'low' : lp < 5 ? 'warn' : '';\n      }\n\n      /* ---------- PER LAP ---------- */\n      perEl.textContent = per == null || per <= 0 ? '--' : per.toFixed(2);\n\n      /* ---------- SUGGESTED ADD ---------- */\n      var add = suggestAdd(st, fuel, per);\n      if (add == null) {\n        addEl.textContent = '--';\n        addRow.dataset.level = '';\n      } else if (add > 0.05) {\n        addEl.textContent = '+' + add.toFixed(1);\n        addRow.dataset.level = 'need';\n      } else {\n        // 油够：显示 0.0 而不是负数，避免误读成「要抽油」\n        addEl.textContent = '0.0';\n        addRow.dataset.level = 'ok';\n      }\n    } catch (e) {\n      console.warn('[throttle-fuel] render failed', e);\n    }\n  }\n\n  window.addEventListener('message', function (ev) {\n    var m = ev.data;\n    if (!m || typeof m !== 'object') return;\n    if (m.type === 'acc:init') { sayReady(); return; }\n    if (m.type === 'acc:state' && m.payload) {\n      gotState = true;\n      stopDemo();\n      render(m.payload);\n    }\n  });\n\n  var framed = false;\n  try { framed = !!(window.parent && window.parent !== window); } catch (e) { framed = false; }\n\n  if (framed) {\n    sayReady();\n    demoTimer = setTimeout(function () { if (!gotState) startDemo(); }, 2000);\n  } else {\n    startDemo();\n  }\n\n  /* ------------------------------ 演示数据 ------------------------------ */\n  function startDemo() {\n    stopDemo();\n    var t = 0;\n    var fuel0 = 68.0;\n    demoTick = setInterval(function () {\n      if (gotState) { stopDemo(); return; }\n      t += 1;\n      var per = 2.85;\n      var fuel = fuel0 - t * 0.012; // 慢慢烧\n      if (fuel < 20) { fuel0 = 68.0; t = 0; fuel = fuel0; }\n      render({\n        status: 'streaming',\n        session: { type: 'race', timeLeftMs: 2700000 - t * 400, lapsTotal: 0 },\n        lap: { lastMs: 105400, completed: 12 },\n        car: { fuel: fuel, fuelPerLap: per, fuelLapsLeft: fuel / per },\n      });\n    }, 60);\n  }\n\n  function stopDemo() {\n    if (demoTick !== null) { clearInterval(demoTick); demoTick = null; }\n    if (demoTimer !== null) { clearTimeout(demoTimer); demoTimer = null; }\n  }\n})();\n\n<\/script>\n  <\/body>\n<\/html>\n"}, {"label": "③ 四轮轮胎数据 <span style=\"color:#5B6572\">（四环 2×2 紧凑排列：左上 FL / 右上 FR / 左下 RL / 右下 RR）<\/span>", "id": "tyres", "w": 220, "h": 220, "html": "<!doctype html>\n<html lang=\"zh-CN\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>轮胎数据<\/title>\n    <style>\n/* 轮胎数据 —— 设计基准 220×220，全部 px 写死，缩放交给宿主（contain）。\n *\n * 视觉取向：四个圆环 2×2 紧凑排列（左上 FL / 右上 FR / 左下 RL / 右下 RR），全透明背景。\n *   外圈细环 = 磨损（从 12 点顺时针增长）\n *   内圈 270° 环 = 胎温（40→110 ℃ 映射满环），颜色随热度分档\n *   环心三行  = 胎压 psi / 胎温 ℃ / 刹车盘温 ℃\n *\n * 透明背景下的可读性策略：高饱和纯色 + 1px 硬投影（不是漫反射光晕），不用任何发光/模糊。\n */\n\nhtml,\nbody {\n  height: 100%;\n  margin: 0;\n  padding: 0;\n  background: transparent;\n  overflow: hidden;\n}\n\nbody {\n  /* 与软件外壳同一套字体栈（src/style.css 的 --font-display），数字单独用 --font-mono */\n  font-family: 'Chakra Petch', 'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', sans-serif;\n  color: #ffffff;\n  -webkit-user-select: none;\n  user-select: none;\n  cursor: default;\n}\n\n/* 2×2 紧凑网格：两列两行，画面正中，不留中间空档 */\n.hud {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  display: grid;\n  grid-template-columns: 106px 106px;\n  grid-template-rows: 106px 106px;\n  gap: 4px;\n  justify-content: center;\n  align-content: center;\n}\n\n/* ---------------- 四个圆环 ---------------- */\n.corner {\n  position: relative;\n  width: 106px;\n  height: 106px;\n}\n\n.corner svg {\n  display: block;\n  width: 100%;\n  height: 100%;\n  overflow: visible;\n}\n\n/* pathLength=\"100\" → dasharray 的单位就是百分比，75 = 270°（底部留缺口） */\n.arc-bg {\n  fill: none;\n  stroke: rgba(255, 255, 255, 0.2);\n  stroke-width: 9;\n  stroke-linecap: butt;\n  stroke-dasharray: 75 100;\n}\n\n/* 不做 dasharray / stroke 过渡：数据 60ms 一刷，过渡每帧被打断，\n * 颜色会永远卡在初始档（实测胎温弧一直是 t-na 的灰色，看起来像没画）。\n * 线帽平切：弧的端头是齐口，和另两份主题一致。 */\n.arc-fg {\n  fill: none;\n  stroke-width: 9;\n  stroke-linecap: butt;\n  stroke-dasharray: 0 100;\n  opacity: 0;\n}\n\n/* 胎温分档：高饱和纯色，不加 filter 发光 */\n.arc-fg.t-na {\n  stroke: rgba(255, 255, 255, 0.32);\n}\n\n.arc-fg.t-cold {\n  stroke: #2b8fff;\n}\n\n.arc-fg.t-ok {\n  stroke: #00e676;\n}\n\n.arc-fg.t-warm {\n  stroke: #ffab00;\n}\n\n.arc-fg.t-hot {\n  stroke: #ff2136;\n}\n\n/* 外圈细环 = 磨损 */\n.wear-bg {\n  fill: none;\n  stroke: rgba(255, 255, 255, 0.2);\n  stroke-width: 2;\n}\n\n.wear-fg {\n  fill: none;\n  stroke-width: 2;\n  stroke-linecap: butt;\n  stroke-dasharray: 0 100;\n  opacity: 0;\n}\n\n.wear-fg.w-ok {\n  stroke: #00e676;\n}\n\n.wear-fg.w-warn {\n  stroke: #ffab00;\n}\n\n.wear-fg.w-bad {\n  stroke: #ff2136;\n}\n\n/* ---------------- 环心读数 ---------------- */\n.c-read {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 1px;\n  padding-bottom: 8px;\n  pointer-events: none;\n}\n\n/* 主读数：纯白 + 高饱和分档色以外不加装饰，只靠 1px 硬投影压住底下的弧 */\n.c-read b {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 20px;\n  font-weight: 700;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.02em;\n  color: #ffffff;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n.c-temp {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 11px;\n  line-height: 1;\n  font-weight: 700;\n  color: #e6edf5;\n  font-variant-numeric: tabular-nums;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n.c-brake {\n  font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;\n  font-size: 9px;\n  line-height: 1;\n  font-weight: 700;\n  color: #a9b6c4;\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0.02em;\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n}\n\n/* 角落位置标：压在环外侧，不占环内空间 */\n.c-tag {\n  position: absolute;\n  font-size: 8px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  color: rgba(255, 255, 255, 0.8);\n  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);\n  pointer-events: none;\n}\n\n.corner.fl .c-tag {\n  left: 1px;\n  top: 1px;\n}\n\n.corner.fr .c-tag {\n  right: 1px;\n  top: 1px;\n}\n\n.corner.rl .c-tag {\n  left: 1px;\n  bottom: 1px;\n}\n\n.corner.rr .c-tag {\n  right: 1px;\n  bottom: 1px;\n}\n\n/* 未开始 / 等待：整体压暗，别把上次的值当实时值 */\n.hud[data-status='idle'],\n.hud[data-status='waiting'],\n.hud[data-status='error'] {\n  opacity: 0.5;\n}\n\n<\/style>\n  <\/head>\n  <body>\n    <!-- 设计基准 220×220（见 theme.json）。宿主按 contain 等比缩放，直接按像素写。\n         视觉：四环 2×2 紧凑排列（左上 FL / 右上 FR / 左下 RL / 右下 RR），\n         全透明背景，没有车形、没有底板、没有发光。 -->\n    <div class=\"hud\" id=\"hud\" data-status=\"idle\">\n      <!-- 左前 -->\n      <div class=\"corner fl\">\n        <svg viewBox=\"0 0 106 106\" aria-hidden=\"true\">\n          <circle class=\"wear-bg\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"wear-fg w-ok\" id=\"wear-FL\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"arc-bg\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n          <circle class=\"arc-fg t-na\" id=\"arc-FL\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n        <\/svg>\n        <div class=\"c-read\">\n          <b id=\"psi-FL\">--<\/b>\n          <span class=\"c-temp\" id=\"temp-FL\">--°C<\/span>\n          <span class=\"c-brake\" id=\"brake-FL\">B --<\/span>\n        <\/div>\n        <span class=\"c-tag\">FL<\/span>\n      <\/div>\n\n      <!-- 右前 -->\n      <div class=\"corner fr\">\n        <svg viewBox=\"0 0 106 106\" aria-hidden=\"true\">\n          <circle class=\"wear-bg\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"wear-fg w-ok\" id=\"wear-FR\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"arc-bg\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n          <circle class=\"arc-fg t-na\" id=\"arc-FR\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n        <\/svg>\n        <div class=\"c-read\">\n          <b id=\"psi-FR\">--<\/b>\n          <span class=\"c-temp\" id=\"temp-FR\">--°C<\/span>\n          <span class=\"c-brake\" id=\"brake-FR\">B --<\/span>\n        <\/div>\n        <span class=\"c-tag\">FR<\/span>\n      <\/div>\n\n      <!-- 左后 -->\n      <div class=\"corner rl\">\n        <svg viewBox=\"0 0 106 106\" aria-hidden=\"true\">\n          <circle class=\"wear-bg\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"wear-fg w-ok\" id=\"wear-RL\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"arc-bg\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n          <circle class=\"arc-fg t-na\" id=\"arc-RL\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n        <\/svg>\n        <div class=\"c-read\">\n          <b id=\"psi-RL\">--<\/b>\n          <span class=\"c-temp\" id=\"temp-RL\">--°C<\/span>\n          <span class=\"c-brake\" id=\"brake-RL\">B --<\/span>\n        <\/div>\n        <span class=\"c-tag\">RL<\/span>\n      <\/div>\n\n      <!-- 右后 -->\n      <div class=\"corner rr\">\n        <svg viewBox=\"0 0 106 106\" aria-hidden=\"true\">\n          <circle class=\"wear-bg\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"wear-fg w-ok\" id=\"wear-RR\" cx=\"53\" cy=\"53\" r=\"49\" pathLength=\"100\" transform=\"rotate(-90 53 53)\" />\n          <circle class=\"arc-bg\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n          <circle class=\"arc-fg t-na\" id=\"arc-RR\" cx=\"53\" cy=\"53\" r=\"39\" pathLength=\"100\" transform=\"rotate(135 53 53)\" />\n        <\/svg>\n        <div class=\"c-read\">\n          <b id=\"psi-RR\">--<\/b>\n          <span class=\"c-temp\" id=\"temp-RR\">--°C<\/span>\n          <span class=\"c-brake\" id=\"brake-RR\">B --<\/span>\n        <\/div>\n        <span class=\"c-tag\">RR<\/span>\n      <\/div>\n    <\/div>\n\n    <script>\n/* 轮胎数据 —— 主题侧脚本。\n *\n * 宿主 → 主题：{ type:'acc:init' } / { type:'acc:state', payload }\n * 主题 → 宿主：{ type:'acc:ready' }\n * 独立打开（双击 index.html）没有宿主，2 秒后自动跑演示数据。\n *\n * 圆环用 pathLength=\"100\" 归一化：270° 整圈 = 75 个单位，满圆磨损环 = 100 个单位。\n */\n(function () {\n  'use strict';\n\n  var $ = function (id) { return document.getElementById(id); };\n  // isFinite(null) === true 是个坑：真机 null 字段必须先挡掉\n  function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }\n  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }\n\n  var WHEELS = ['FL', 'FR', 'RL', 'RR'];\n\n  var hud = $('hud');\n  var gotState = false;\n  var demoTimer = null;\n  var demoTick = null;\n\n  function sayReady() {\n    try { window.parent.postMessage({ type: 'acc:ready' }, '*'); } catch (e) { /* ignore */ }\n  }\n\n  /* 胎温 → 颜色档（40℃ 起算，110℃ 满环） */\n  function heatLevel(t) {\n    if (t == null) return 'na';\n    if (t < 60) return 'cold';\n    if (t < 85) return 'ok';\n    if (t < 100) return 'warm';\n    return 'hot';\n  }\n\n  function wearClass(w) {\n    if (w == null) return 'w-ok';\n    if (w < 0.25) return 'w-ok';\n    if (w < 0.55) return 'w-warn';\n    return 'w-bad';\n  }\n\n  /* corner 可能是 'FL' / 'frontLeft' 等写法，统一归一化 */\n  function normCorner(c) {\n    if (!c) return null;\n    var s = String(c).toLowerCase().replace(/[^a-z]/g, '');\n    if (s === 'fl' || s === 'frontleft') return 'FL';\n    if (s === 'fr' || s === 'frontright') return 'FR';\n    if (s === 'rl' || s === 'rearleft' || s === 'backleft') return 'RL';\n    if (s === 'rr' || s === 'rearright' || s === 'backright') return 'RR';\n    return null;\n  }\n\n  function paint(k, w) {\n    var p = num(w && w.pressure);\n    var t = num(w && w.temp);\n    var b = num(w && w.brakeTemp);\n    var we = num(w && w.wear);\n\n    $('psi-' + k).textContent = p == null ? '--' : p.toFixed(1);\n    $('temp-' + k).textContent = t == null ? '--°C' : Math.round(t) + '°C';\n    $('brake-' + k).textContent = b == null ? 'B --' : 'B ' + Math.round(b) + '°';\n\n    // 胎温 270° 环（dasharray 归零时 round cap 会留一个圆点，所以 0 直接隐藏）\n    var arc = $('arc-' + k);\n    var tp = t == null ? 0 : clamp01((t - 40) / 70);\n    arc.style.strokeDasharray = (75 * tp).toFixed(2) + ' 100';\n    arc.style.opacity = tp > 0.002 ? '1' : '0';\n    // 档位没变就不要重设 class：每帧 setAttribute 会让样式失效重算（配合过渡会把颜色卡住）\n    var ac = 'arc-fg t-' + heatLevel(t);\n    if (arc.getAttribute('class') !== ac) arc.setAttribute('class', ac);\n\n    // 磨损细环（满圆）\n    var wi = $('wear-' + k);\n    var wp = we == null ? 0 : clamp01(we);\n    wi.style.strokeDasharray = (wp * 100).toFixed(2) + ' 100';\n    wi.style.opacity = wp > 0.002 ? '1' : '0';\n    var wc = 'wear-fg ' + wearClass(we);\n    if (wi.getAttribute('class') !== wc) wi.setAttribute('class', wc);\n  }\n\n  function render(st) {\n    try {\n      hud.dataset.status = st.status || 'idle';\n\n      var list = Array.isArray(st.wheels) ? st.wheels : [];\n      var map = {};\n\n      for (var i = 0; i < list.length; i++) {\n        var k = normCorner(list[i] && list[i].corner);\n        if (k && !map[k]) map[k] = list[i];\n      }\n\n      // 一个 corner 都认不出来时，按数组顺序兜底（契约里顺序是 FL/FR/RL/RR）\n      var hit = 0;\n      for (var j = 0; j < WHEELS.length; j++) if (map[WHEELS[j]]) hit++;\n      if (hit === 0) {\n        for (var m = 0; m < WHEELS.length && m < list.length; m++) map[WHEELS[m]] = list[m];\n      }\n\n      for (var n = 0; n < WHEELS.length; n++) paint(WHEELS[n], map[WHEELS[n]]);\n    } catch (e) {\n      console.warn('[tyres] render failed', e);\n    }\n  }\n\n  window.addEventListener('message', function (ev) {\n    var m = ev.data;\n    if (!m || typeof m !== 'object') return;\n    if (m.type === 'acc:init') { sayReady(); return; }\n    if (m.type === 'acc:state' && m.payload) {\n      gotState = true;\n      stopDemo();\n      render(m.payload);\n    }\n  });\n\n  var framed = false;\n  try { framed = !!(window.parent && window.parent !== window); } catch (e) { framed = false; }\n\n  if (framed) {\n    sayReady();\n    demoTimer = setTimeout(function () { if (!gotState) startDemo(); }, 2000);\n  } else {\n    startDemo();\n  }\n\n  /* ------------------------------ 演示数据 ------------------------------ */\n  function startDemo() {\n    stopDemo();\n    var t = 0;\n    demoTick = setInterval(function () {\n      if (gotState) { stopDemo(); return; }\n      t += 1;\n      render({\n        status: 'streaming',\n        wheels: [\n          { corner: 'FL', pressure: 27.4, temp: 78 + 8 * Math.sin(t / 9), brakeTemp: 410 + 60 * Math.sin(t / 7), wear: 0.14 },\n          { corner: 'FR', pressure: 27.6, temp: 84 + 8 * Math.sin(t / 9 + 1), brakeTemp: 425 + 60 * Math.sin(t / 7 + 1), wear: 0.14 },\n          { corner: 'RL', pressure: 27.0, temp: 72 + 8 * Math.sin(t / 9 + 2), brakeTemp: 355 + 60 * Math.sin(t / 7 + 2), wear: 0.31 },\n          { corner: 'RR', pressure: 27.2, temp: 76 + 8 * Math.sin(t / 9 + 3), brakeTemp: 362 + 60 * Math.sin(t / 7 + 3), wear: 0.31 },\n        ],\n      });\n    }, 60);\n  }\n\n  function stopDemo() {\n    if (demoTick !== null) { clearInterval(demoTick); demoTick = null; }\n    if (demoTimer !== null) { clearTimeout(demoTimer); demoTimer = null; }\n  }\n})();\n\n<\/script>\n  <\/body>\n<\/html>\n"}];
  var grid = document.getElementById('grid');
  var frames = [];
  THEMES.forEach(function (t) {
    var item = document.createElement('div'); item.className = 'item';
    var cap = document.createElement('div'); cap.className = 'cap'; cap.innerHTML = t.label;
    var meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = t.id + ' · ' + t.w + '×' + t.h;
    var stage = document.createElement('div'); stage.className = 'stage';
    stage.style.width = (t.w + 40) + 'px'; stage.style.height = (t.h + 40) + 'px';
    var f = document.createElement('iframe');
    f.width = t.w; f.height = t.h; f.srcdoc = t.html;
    stage.appendChild(f);
    item.appendChild(cap); item.appendChild(meta); item.appendChild(stage);
    grid.appendChild(item);
    frames.push(f);
  });
  function postAll(msg) {
    frames.forEach(function (f) { try { f.contentWindow.postMessage(msg, '*'); } catch (e) {} });
  }
  var t0 = performance.now();
  setInterval(function () {
    var t = (performance.now() - t0) / 1000;
    var w = Math.sin(t * 1.6);
    var fuel = 55 + 10 * Math.sin(t * 0.15);
    var per = 2.85;
    postAll({ type: 'acc:state', payload: { v: 1, status: 'streaming',
      // session + lap 给建议加油量用：计时赛剩余时间 / 上一圈圈时
      session: { type: 'race', timeLeftMs: 2700000 - t * 4000, lapsTotal: 0 },
      lap: { lastMs: 105400, completed: 12, bestMs: 104800 },
      car: { throttle: Math.max(0, Math.min(1, 0.6 + 0.4 * w)),
             brake: Math.max(0, Math.min(1, 0.45 - 0.45 * w)),
             steer: Math.sin(t * 0.7) * 0.75,
             fuel: fuel, fuelPerLap: per, fuelLapsLeft: fuel / per },
      wheels: [
        { corner: 'FL', pressure: 27.4, temp: 78 + 8 * Math.sin(t * 1.1),     brakeTemp: 410 + 40 * Math.sin(t * 1.3),     wear: 0.14 },
        { corner: 'FR', pressure: 27.6, temp: 82 + 8 * Math.sin(t * 1.1 + 1), brakeTemp: 420 + 40 * Math.sin(t * 1.3 + 1), wear: 0.14 },
        { corner: 'RL', pressure: 27.0, temp: 74 + 8 * Math.sin(t * 1.1 + 2), brakeTemp: 355 + 40 * Math.sin(t * 1.3 + 2), wear: 0.31 },
        { corner: 'RR', pressure: 27.2, temp: 76 + 8 * Math.sin(t * 1.1 + 3), brakeTemp: 360 + 40 * Math.sin(t * 1.3 + 3), wear: 0.31 }
      ] } });
  }, 60);
  setInterval(function () { postAll({ type: 'acc:init' }); }, 500);
  </script>
