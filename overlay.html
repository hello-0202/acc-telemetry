<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACC Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #overlay {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="overlay"></div>
    <script type="module" src="/src/overlay.js"></script>
  </body>
</html>
