<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>踏板 + 方向盘</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <!-- 设计基准 300×190（见 theme.json）。宿主按 contain 等比缩放，直接按像素写。
         视觉：左侧两根竖直矩形踏板条（从底部往上填充，油门/刹车并排）+ 右侧转向环，
         背景透明无底板，纯色填充、直角边界、无发光。
         踏板与 pedal-trace 用的是同一套语言：数字在条上方、纯数字无 %、红 / 绿跟随
         各自语义色；条内只有贴框的纯色块，没有刻度线，也不放中文标签。 -->
    <div class="hud" id="hud" data-status="idle">
      <!-- 左：刹车 + 油门并排（红=刹车 / 绿=油门，颜色本身就是标签） -->
      <div class="pedals">
        <div class="pedal brake">
          <span class="p-val" id="brake-val">--</span>
          <div class="p-bar">
            <div class="p-fill" id="brake-fill"></div>
          </div>
        </div>

        <div class="pedal thr">
          <span class="p-val" id="thr-val">--</span>
          <div class="p-bar">
            <div class="p-fill" id="thr-fill"></div>
          </div>
        </div>
      </div>

      <!-- 右：外围 270° 进度弧（蓝=左 / 橙=右，弧长=幅度，走 pedal-trace 同一条
           视觉增益曲线：0~200° 放大到满舵弧长的 82%，200~450° 压进末段 18%）+
           环心换成 F1 方向盘线稿，盘顶那个小矩形当指针：盘转角与弧长同源，
           所以指针始终停在彩色弧的末端、指着当前转向那一档颜色。
           已去掉下方角度数字，整块图标在 190 高的槽里垂直居中。 -->
      <div class="steer">
        <svg class="ring" viewBox="0 0 168 168" aria-hidden="true">
          <defs>
            <!-- F1 方向盘（圆滑版）。路径原样取自 docs/steering-wheel/f1-yoke.svg
                 （= preview.html 的「F1 圆滑」），原始坐标 200×200、几何中心 (100,100)，
                 下面用 translate/scale 摆到环心 (84,84)。改形状只改这里的 d。 -->
            <g id="st-wheel-lines">
              <path d="M 134.1,34 Q 144,34 152.9,38.4 L 179.2,51.6 Q 188,56 188,65.9 L 188,134.1 Q 188,144 179.2,148.4 L 152.9,161.6 Q 144,166 134.1,166
                       L 65.9,166 Q 56,166 47.1,161.6 L 20.8,148.4 Q 12,144 12,134.1 L 12,65.9 Q 12,56 20.8,51.6 L 47.1,38.4 Q 56,34 65.9,34 Z" />
              <path d="M 12,100 H 81.3" />
              <path d="M 118.7,100 H 188" />
              <circle cx="100" cy="100" r="18.7" />
            </g>
            <!-- 12 点指针：盘顶的小矩形（原图里用来分正反），这里当转向指针用 -->
            <g id="st-wheel-mark">
              <rect x="97.6" y="27" width="4.8" height="13" rx="1.4" />
            </g>
          </defs>

          <!-- 盘面：白线 + 深色衬底两层（和原来的内圈同理，浅色 / 深色画面上都能看见）。
               transform 由 theme.js 写：rotate(±135 84 84)，和进度弧同一角度。 -->
          <g id="st-wheel">
            <g transform="translate(84 84) scale(0.44) translate(-100 -100)">
              <use href="#st-wheel-lines" class="w-bed" />
              <use href="#st-wheel-lines" class="w-ink" />
              <use href="#st-wheel-mark" class="w-mark-bed" />
              <use href="#st-wheel-mark" class="w-mark-ink" />
            </g>
          </g>

          <!-- 进度槽：270°，缺口朝下，深色（与踏板槽同色），标出左右满舵可达范围 -->
          <circle class="st-track" cx="84" cy="84" r="64" pathLength="100" transform="rotate(135 84 84)" />
          <!-- 右转弧：从正上方顺时针生长；左转弧：从正上方逆时针生长（rotate 由 JS 跟随弧长更新） -->
          <circle class="st-right" id="st-right" cx="84" cy="84" r="64" pathLength="100" transform="rotate(-90 84 84)" />
          <circle class="st-left" id="st-left" cx="84" cy="84" r="64" pathLength="100" transform="rotate(-90 84 84)" />
        </svg>
      </div>
    </div>

    <script src="./theme.js"></script>
  </body>
</html>
