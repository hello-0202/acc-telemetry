<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>踏板 + 方向盘</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <!-- 设计基准 300×190（见 theme.json）。宿主按 contain 等比缩放，直接按像素写。
         视觉：左侧两根竖直矩形踏板条（从底部往上填充，油门/刹车并排）+ 右侧转向环，
         背景透明无底板，纯色填充、直角边界、无发光。
         踏板与 pedal-trace 用的是同一套语言：数字在条上方、纯数字无 %、红 / 绿跟随
         各自语义色；条内只有贴框的纯色块，没有刻度线，也不放中文标签。 -->
    <div class="hud" id="hud" data-status="idle">
      <!-- 左：刹车 + 油门并排（红=刹车 / 绿=油门，颜色本身就是标签） -->
      <div class="pedals">
        <div class="pedal brake">
          <span class="p-val" id="brake-val">--</span>
          <div class="p-bar">
            <div class="p-fill" id="brake-fill"></div>
          </div>
        </div>

        <div class="pedal thr">
          <span class="p-val" id="thr-val">--</span>
          <div class="p-bar">
            <div class="p-fill" id="thr-fill"></div>
          </div>
        </div>
      </div>

      <!-- 右：外围 270° 进度弧（蓝=左 / 橙=右，弧长=幅度，走 pedal-trace 同一条
           视觉增益曲线：0~200° 放大到满舵弧长的 82%，200~450° 压进末段 18%）+
           环心换成白色实心方向盘图标，盘沿 12 点位置切一道刻痕当指针：盘转角与弧长
           同源，所以刻痕始终停在彩色弧的末端、指着当前转向那一档颜色。
           已去掉下方角度数字，整块图标在 190 高的槽里垂直居中。 -->
      <div class="steer">
        <svg class="ring" viewBox="0 0 168 168" aria-hidden="true">
          <defs>
            <!-- 方向盘实心图标：原始文件 方向盘.svg，已存档到
                 docs/steering-wheel/white-wheel.svg。原始 viewBox 1024×1024、
                 单一 path（6 个子路径，外圈 + 辐条 + 中心），实测包围盒
                 getBBox = x15.3 y9.3 w988.3 h1008.6（中心 509.5, 513.6）、
                 原始填充 #999999。改形状只改这条 d；摆位看下面 #st-wheel 的 transform。 -->
            <path id="st-wheel-shape" d="M326.858272 982.016c-63.007605-25.85284-119.643654-64.651062-166.798223-113.234173C70.643358 776.634469 15.334716 649.317136 15.334716 508.713086c0-140.578765 55.296-267.908741 144.725333-360.043456C250.209975 55.776395 379.853432 9.329778 509.496889 9.329778c129.630815 0 259.286914 46.446617 349.424197 139.314568 89.429333 92.16 144.750617 219.464691 144.750618 360.056098 0 140.616691-55.321284 267.934025-144.750618 360.081383a493.909333 493.909333 0 0 1-166.78558 113.234173 481.709827 481.709827 0 0 1-182.638617 35.90321c-62.173235 0-124.295901-11.997235-182.638617-35.90321zM509.496889 110.870123c-103.537778 0-207.075556 37.091556-279.058963 111.287309a408.740346 408.740346 0 0 0-95.48484 159.048691c-5.410765 20.35358 1.79516 29.974123 21.617778 28.874272 64.941827-2.578963 204.901136-4.626963 233.66163-6.118716a165.963852 165.963852 0 0 0-39.670519 108.227951c0 45.220346 17.787259 86.180346 46.547753 115.813135 10.265284 10.581333 21.946469 19.721481 34.702223 27.091754a155.091753 155.091753 0 0 0 155.369876 0 159.579654 159.579654 0 0 0 34.702222-27.091754c28.760494-29.63279 46.547753-70.59279 46.547753-115.800493 0-41.490963-14.980741-79.378963-39.657876-108.240593 28.747852 1.491753 168.70716 3.539753 233.648988 6.118716 19.809975 1.099852 27.028543-8.508049 21.617777-28.874272a408.487506 408.487506 0 0 0-95.484839-159.048691c-71.983407-74.208395-175.521185-111.287309-279.058963-111.287309z m89.176494 309.601976c-46.01679-47.407407-132.361481-47.407407-178.36563 0a131.577679 131.577679 0 0 0-36.939852 91.881876c0 35.90321 14.121086 68.393086 36.939852 91.907161a126.78637 126.78637 0 0 0 29.936198 22.856691 123.474173 123.474173 0 0 0 118.505876 0 126.748444 126.748444 0 0 0 29.923556-22.856691 131.565037 131.565037 0 0 0 36.952494-91.907161c0-35.877926-14.121086-68.367802-36.952494-91.881876z m-66.281877 139.883457c17.256296-8.722963 29.127111-27.028543 29.127111-48.165926 0-22.388938-13.337284-41.592099-32.274963-49.607111a50.985086 50.985086 0 0 0-39.480889 0c-18.950321 8.015012-32.287605 27.218173-32.287605 49.607111 0 21.137383 11.870815 39.442963 29.11447 48.165926 14.285432 7.205926 31.529086 7.205926 45.801876 0z m59.012741 347.224493c76.104691-16.560988 144.143802-55.700543 197.151605-110.313876a409.890765 409.890765 0 0 0 109.087605-213.649383c5.30963-22.426864-4.058074-29.291457-20.467358-28.747852-33.071407-0.733235-66.168099-0.581531-97.697185 5.537185-112.361877 21.832691-152.550716 77.69758-172.436544 206.317037-7.205926 46.712099-11.807605 101.388642-15.638123 140.856889z m-163.827358 0c-3.817877-39.468247-8.419556-94.14479-15.638124-140.856889-19.873185-128.619457-60.074667-184.484346-172.436543-206.317037-31.516444-6.118716-64.625778-6.27042-97.697185-5.537185-16.396642-0.543605-25.764346 6.320988-20.454716 28.747852a409.890765 409.890765 0 0 0 109.087605 213.649383c53.007802 54.613333 121.034272 93.765531 197.138963 110.313876z" />
          </defs>

          <!-- 盘面：白色实心 + 同一条路径的深色细描边（见 theme.css 的 .w-ink）。
               transform 由 theme.js 写：rotate(±135 84 84)，和进度弧同一角度。
               摆位：先把包围盒中心 (509.5, 513.6) 挪到原点，scale 0.0859 后盘面直径
               约 84（环半径 64、环内沿 60 → 盘沿与进度弧之间还有约 13px 净空，
               比原来的 74 放大一圈；再大就会贴到弧上），再挪到环心 (84,84)。 -->
          <g id="st-wheel">
            <g transform="translate(84 84) scale(0.0859) translate(-509.5 -513.6)">
              <use href="#st-wheel-shape" class="w-ink" />
            </g>
            <!-- 12 点指针：盘沿上的一道深色刻痕，跟着盘一起转，位置就是当前转角。
                 坐标在 168 的 viewBox 里（不在图标的 scale 组内），所以单位就是环的
                 单位：盘顶 y=40.7、盘沿厚 8.7 → 刻痕 y 38.1 起、高 13.9（上下各露出
                 2.6）、宽 5.6。压在白色盘沿上，深浅背景都读得出，也不会像小方块
                 那样在盘外糊成一个白点。 -->
            <rect class="w-notch" x="81.2" y="38.1" width="5.6" height="13.9" rx="1.2" />
          </g>

          <!-- 进度槽：270°，缺口朝下，深色（与踏板槽同色），标出左右满舵可达范围 -->
          <circle class="st-track" cx="84" cy="84" r="64" pathLength="100" transform="rotate(135 84 84)" />
          <!-- 右转弧：从正上方顺时针生长；左转弧：从正上方逆时针生长（rotate 由 JS 跟随弧长更新） -->
          <circle class="st-right" id="st-right" cx="84" cy="84" r="64" pathLength="100" transform="rotate(-90 84 84)" />
          <circle class="st-left" id="st-left" cx="84" cy="84" r="64" pathLength="100" transform="rotate(-90 84 84)" />
        </svg>
      </div>
    </div>

    <script src="./theme.js"></script>
  </body>
</html>
