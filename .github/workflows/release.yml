name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Python telemetry sidecar
        shell: bash
        run: |
          cd python-server
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller
          .venv/Scripts/python -m PyInstaller telemetry_core.spec --noconfirm --workpath build_new --distpath dist_new
          cp dist_new/telemetry_core.exe ../src-tauri/binaries/telemetry_core-x86_64-pc-windows-msvc.exe

      - name: Build and publish (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ACC Telemetry ${{ github.ref_name }}"
          releaseBody: "See the CHANGELOG.md for details."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
