name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Python telemetry sidecar
        shell: bash
        run: |
          cd python-server
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller
          .venv/Scripts/python -m PyInstaller telemetry_core.spec --noconfirm --workpath build_new --distpath dist_new
          cp dist_new/telemetry_core.exe ../src-tauri/binaries/telemetry_core-x86_64-pc-windows-msvc.exe

      - name: Build and publish (draft)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ACC Telemetry ${{ github.ref_name }}"
          releaseBody: "See the CHANGELOG.md for details."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

  publish-gitee:
    needs: release
    runs-on: ubuntu-latest
    # 跨海上传到 Gitee 偶发卡死；有总超时就不会挂半小时
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      GITEE_REPO: helloets/acc-telemetry-releases
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Download assets from GitHub draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | [.id,.name] | @tsv' > assets.tsv
          latest_id=$(awk -F'\t' '$2=="latest.json"{print $1}' assets.tsv)
          exe_id=$(awk -F'\t' '$2 ~ /-setup\.exe$/{print $1; exit}' assets.tsv)
          exe_name=$(awk -F'\t' '$2 ~ /-setup\.exe$/{print $2; exit}' assets.tsv)
          msi_id=$(awk -F'\t' '$2 ~ /\.msi$/{print $1; exit}' assets.tsv)
          msi_name=$(awk -F'\t' '$2 ~ /\.msi$/{print $2; exit}' assets.tsv)
          test -n "$latest_id"
          test -n "$exe_id"
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/${latest_id}" > out/latest.json
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/${exe_id}" > "out/${exe_name}"
          echo "EXE_NAME=${exe_name}" >> "$GITHUB_ENV"
          # MSI 平台的签名对应 .msi 文件，URL 必须分开指向，不能统一改成 setup.exe
          if [ -n "$msi_id" ]; then
            gh api -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/${msi_id}" > "out/${msi_name}"
            echo "MSI_NAME=${msi_name}" >> "$GITHUB_ENV"
            test -s "out/${msi_name}"
          fi
          test -s out/latest.json
          test -s "out/${exe_name}"

      - name: Rewrite latest.json for Gitee
        run: |
          set -euo pipefail
          EXE_URL="https://gitee.com/${GITEE_REPO}/releases/download/${TAG}/${EXE_NAME}"
          MSI_URL=""
          if [ -n "${MSI_NAME:-}" ]; then
            MSI_URL="https://gitee.com/${GITEE_REPO}/releases/download/${TAG}/${MSI_NAME}"
          fi
          python3 - "$EXE_URL" "$MSI_URL" <<'PY'
          import json, sys
          exe_url, msi_url = sys.argv[1], sys.argv[2]
          with open('out/latest.json', encoding='utf-8') as f:
              d = json.load(f)
          for key, plat in d.get('platforms', {}).items():
              if key.endswith('-msi'):
                  if not msi_url:
                      sys.exit(f'{key} 需要 MSI 安装包，但 GitHub Release 里没有 .msi 资产')
                  plat['url'] = msi_url
              else:
                  plat['url'] = exe_url
          with open('out/latest.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
          PY
          cat out/latest.json

      - name: Push tag to Gitee
        run: |
          set -euo pipefail
          git clone "https://helloets:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" gitee-repo
          cd gitee-repo
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # 清单固定放 main（v1.2.0 起 updater 读的就是 raw/main）。
          # 仓库默认分支是 master，clone 下来要先切到 main，否则 push 会分叉失败。
          git checkout main 2>/dev/null || git checkout -b main
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create Gitee release (reuse if it already exists)
        run: |
          set -euo pipefail
          # 先查同 tag 的发行版；重跑 workflow 时直接复用，避免 409
          LIST=$(curl -sS --connect-timeout 20 --max-time 60 \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases?per_page=100" \
            -H "Authorization: token ${GITEE_TOKEN}")
          RELEASE_ID=$(printf '%s' "$LIST" | TAG="$TAG" python3 -c '
          import json, os, sys
          tag = os.environ["TAG"]
          try:
              for r in json.load(sys.stdin):
                  if r.get("tag_name") == tag:
                      print(r.get("id"))
                      break
          except Exception:
              pass
          ')
          if [ -z "$RELEASE_ID" ]; then
            BODY=$(printf '{"tag_name":"%s","name":"%s","body":"See CHANGELOG.md","prerelease":false}' "$TAG" "$TAG")
            CODE=$(curl -sS --connect-timeout 20 --max-time 60 \
              -o /tmp/release.json -w "%{http_code}" \
              -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -H "Content-Type: application/json" -d "$BODY")
            echo "create release: HTTP ${CODE}"
            cat /tmp/release.json
            echo
            [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || exit 1
            RELEASE_ID=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["id"])')
          fi
          echo "GITEE_RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "using Gitee release id ${RELEASE_ID} for ${TAG}"

      - name: Upload installers to Gitee
        run: |
          set -euo pipefail
          upload() {
            local file="$1" code
            code=$(curl -sS --connect-timeout 20 --max-time 600 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              -o /tmp/upload.json -w "%{http_code}" \
              -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${GITEE_RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${file}")
            echo "upload ${file}: HTTP ${code}"
            cat /tmp/upload.json || true
            echo
            [ "$code" = "200" ] || [ "$code" = "201" ] || return 1
          }
          upload "out/${EXE_NAME}"
          if [ -n "${MSI_NAME:-}" ]; then upload "out/${MSI_NAME}"; fi

      # 清单最后推：安装包全部上传成功之前，Gitee 继续停在上一版清单，
      # 不会出现“清单指向不存在的附件”。
      - name: Publish latest.json to Gitee
        run: |
          set -euo pipefail
          cd gitee-repo
          mkdir -p update
          cp ../out/latest.json update/latest.json
          git add update/latest.json
          git commit -m "chore: update latest.json for ${TAG}" || true
          git push origin main
